{% load i18n role_tags %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
<div class="container">
<a class="navbar-brand" href="/">{% trans "European Era Mobility Portal" %}</a>
<div class="ms-auto d-flex gap-2">
<form action="{% url 'set_language' %}" method="post">{% csrf_token %}
<input name="next" type="hidden" value="{{ request.path }}">
<select name="language" onchange="this.form.submit()" class="form-select form-select-sm">
{% get_current_language as LANGUAGE_CODE %}
<option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>EN</option>
<option value="es" {% if LANGUAGE_CODE == 'es' %}selected{% endif %}>ES</option>
</select>
</form>
{% if user.is_authenticated %}<a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">{% trans "Logout" %}</a>{% endif %}
</div></div></nav>
<div class="container">
{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</div>
</body></html>
