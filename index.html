<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Snake</h1>
      <div class="hud">
        <p>Score: <span id="score">0</span></p>
        <button id="restart" type="button">Restart</button>
      </div>
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <p class="help">Use arrow keys or WASD to move. Eat food and avoid walls and yourself.</p>
      <p id="status" class="status">Press any direction key to start.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
