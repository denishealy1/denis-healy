{% load i18n %}
<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
<title>{% trans "European Era Mobility Portal" %}</title></head><body>
<nav class='navbar navbar-expand-lg navbar-dark bg-dark'><div class='container'>
<a class='navbar-brand' href='{% url "dashboard" %}'>Malaga Portal</a>
<div class='d-flex gap-2'>
<form method='post' action='{% url "set_language" %}'>{% csrf_token %}
<select name='language' onchange='this.form.submit()' class='form-select form-select-sm'>
<option value='en'>EN</option><option value='es'>ES</option></select></form>
{% if request.user.is_authenticated %}<a class='btn btn-sm btn-outline-light' href='{% url "logout" %}'>{% trans "Logout" %}</a>{% endif %}
</div></div></nav>
<div class='container mt-4'>
{% for message in messages %}<div class='alert alert-info'>{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</div></body></html>
